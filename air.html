<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air & Atmosphere Monitoring - Oxygen Security</title>
<style>
body { margin:0; font-family: Arial; background:#87ceeb; color:#000; }
.container { max-width:800px; margin:auto; padding:20px; }
h1 { text-align:center; color:#003366; }
form { display:flex; flex-direction:column; gap:12px; }
input, select, textarea, button { padding:10px; border-radius:6px; border:1px solid #003366; font-size:1em; }
button { background:#003366; color:#fff; font-weight:bold; cursor:pointer; }
button:hover { background:#0055a5; }
.back-link { margin-top:20px; text-align:center; }
.back-link a { color:#003366; text-decoration:underline; }
</style>
</head>
<body>

<div class="container">
<h1>Air & Atmosphere Monitoring</h1>

<form id="dataForm">
    <label>Site/User ID</label>
    <input type="text" name="userID" required>

    <label>Location</label>
    <input type="text" name="location" required>

    <label>Oxygen Level (%)</label>
    <input type="number" step="0.01" name="oxygen" required>

    <label>Temperature (°C)</label>
    <input type="number" step="0.1" name="temperature">

    <label>Notes</label>
    <textarea name="notes" rows="3"></textarea>

    <button type="button" onclick="saveData()">Save to USB</button>
</form>

<div class="back-link">
    <a href="oxygen-security.html">Back to Oxygen Security</a>
</div>
</div>

<script>
function saveData(){
    const form=document.getElementById('dataForm');
    const data={timestamp:new Date().toISOString()};
    for(let el of form.elements){ if(el.name) data[el.name]=el.value; }
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download="air_data_"+new Date().toISOString().replace(/[:.]/g,'-')+".json";
    a.click();
    URL.revokeObjectURL(a.href);
    alert("Data saved to USB!");
}
</script>

</body>
</html>
